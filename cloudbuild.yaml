# =============================================================================
# NARA E-commerce — Cloud Build → Cloud Run
# =============================================================================
substitutions:
  _REGION: us-central1
  _AR_REPO: nara
  _SERVICE_API: nara-api
  _SERVICE_USER: nara-user
  _SERVICE_ADMIN: nara-admin
  _CLOUD_SQL_INSTANCE: "" # Formato: "proyecto:region:instancia"
  _API_CPU: "1"
  _API_MEMORY: 512Mi
  _WEB_CPU: "1"
  _WEB_MEMORY: 256Mi

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1800s

steps:
  # ---------------------------------------------------------------------------
  # 1. Backend — Build
  # ---------------------------------------------------------------------------
  - id: build-api
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - backend/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_API}:${COMMIT_SHA}
      - --cache-from
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_API}:latest
      - .
    waitFor: ['-']

  # ---------------------------------------------------------------------------
  # 2. Frontend User — Build
  # ---------------------------------------------------------------------------
  - id: build-user
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - frontend-user/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_USER}:${COMMIT_SHA}
      - --cache-from
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_USER}:latest
      - .
    waitFor: ['-']

  # ---------------------------------------------------------------------------
  # 3. Frontend Admin — Build
  # ---------------------------------------------------------------------------
  - id: build-admin
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - frontend-admin/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_ADMIN}:${COMMIT_SHA}
      - --cache-from
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_ADMIN}:latest
      - .
    waitFor: ['-']

  # ---------------------------------------------------------------------------
  # 4. Push all images
  # ---------------------------------------------------------------------------
  - id: push-images
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}
    waitFor:
      - build-api
      - build-user
      - build-admin

  # ---------------------------------------------------------------------------
  # 5. Database Migrations (se ejecuta antes de que el nuevo servicio reciba tráfico)
  # ---------------------------------------------------------------------------
  - id: migrate-db
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - jobs
      - execute
      - ${_SERVICE_API}-migrate
      - --region
      - ${_REGION}
      - --wait
    waitFor: [push-images]
    
  # ---------------------------------------------------------------------------
  # 6. Backend — Deploy
  # ---------------------------------------------------------------------------
  - id: deploy-api
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_API}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_API}:${COMMIT_SHA}
      - --region=${_REGION}
      - --cpu=${_API_CPU}
      - --memory=${_API_MEMORY}
      - --set-secrets=DATABASE_URL=nara-database-url:latest,JWT_SECRET=nara-jwt-secret:latest
      - --cloud-sql-instances=${_CLOUD_SQL_INSTANCE}
      - --allow-unauthenticated
      - --project=${PROJECT_ID}
    waitFor: [migrate-db]

  # ---------------------------------------------------------------------------
  # 7. Frontend User — Deploy
  # ---------------------------------------------------------------------------
  - id: deploy-user
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_USER}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_USER}:${COMMIT_SHA}
      - --region=${_REGION}
      - --cpu=${_WEB_CPU}
      - --memory=${_WEB_MEMORY}
      - --allow-unauthenticated
      - --project=${PROJECT_ID}
    waitFor: [push-images]

  # ---------------------------------------------------------------------------
  # 8. Frontend Admin — Deploy
  # ---------------------------------------------------------------------------
  - id: deploy-admin
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_ADMIN}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_ADMIN}:${COMMIT_SHA}
      - --region=${_REGION}
      - --cpu=${_WEB_CPU}
      - --memory=${_WEB_MEMORY}
      - --allow-unauthenticated
      - --project=${PROJECT_ID}
    waitFor: [push-images]

# Lista de imágenes a pushear a Artifact Registry
images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_API}:${COMMIT_SHA}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_USER}:${COMMIT_SHA}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_ADMIN}:${COMMIT_SHA}

          --region=${_REGION}
          --platform=managed
          --port=8080
          --cpu=${_API_CPU}
          --memory=${_API_MEMORY}
          --allow-unauthenticated
          --set-secrets=DATABASE_URL=nara-database-url:latest,JWT_SECRET=nara-jwt-secret:latest
          --set-env-vars=RUN_MIGRATIONS=true,NODE_ENV=production
          --quiet)
        if [ -n "${_CLOUD_SQL_INSTANCE}" ]; then
          DEPLOY+=(--add-cloudsql-instances=${_CLOUD_SQL_INSTANCE})
        fi
        "$${DEPLOY[@]}"
    waitFor:
      - build-api

  # ---------------------------------------------------------------------------
  # 3. Obtener URL pública de la API (para VITE_API_URL en frontends)
  # ---------------------------------------------------------------------------
  - id: get-api-url
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        gcloud run services describe ${_SERVICE_API} \
          --region=${_REGION} \
          --format='value(status.url)' | tr -d '\n' > /workspace/api_url.txt
        echo "API URL: $$(cat /workspace/api_url.txt)"
    waitFor:
      - deploy-api

  # ---------------------------------------------------------------------------
  # 4. Frontend user — build con URL de la API
  # ---------------------------------------------------------------------------
  - id: build-user
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        API_URL=$$(cat /workspace/api_url.txt)
        docker build -f frontend-user/Dockerfile \
          --build-arg "VITE_API_URL=$$API_URL" \
          -t ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_USER}:${COMMIT_SHA} \
          -t ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_USER}:latest \
          .
    waitFor:
      - get-api-url

  # ---------------------------------------------------------------------------
  # 5. Frontend user — deploy
  # ---------------------------------------------------------------------------
  - id: deploy-user
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_USER}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_USER}:${COMMIT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --port=8080
      - --cpu=${_WEB_CPU}
      - --memory=${_WEB_MEMORY}
      - --allow-unauthenticated
      - --quiet
    waitFor:
      - build-user

  # ---------------------------------------------------------------------------
  # 6. Frontend admin — build con URL de la API
  # ---------------------------------------------------------------------------
  - id: build-admin
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        API_URL=$$(cat /workspace/api_url.txt)
        docker build -f frontend-admin/Dockerfile \
          --build-arg "VITE_API_URL=$$API_URL" \
          -t ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_ADMIN}:${COMMIT_SHA} \
          -t ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_ADMIN}:latest \
          .
    waitFor:
      - get-api-url

  # ---------------------------------------------------------------------------
  # 7. Frontend admin — deploy
  # ---------------------------------------------------------------------------
  - id: deploy-admin
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_ADMIN}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_ADMIN}:${COMMIT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --port=8080
      - --cpu=${_WEB_CPU}
      - --memory=${_WEB_MEMORY}
      - --allow-unauthenticated
      - --quiet
    waitFor:
      - build-admin

  # ---------------------------------------------------------------------------
  # 8. Actualizar CORS del backend con URLs finales de user y admin
  # ---------------------------------------------------------------------------
  - id: update-api-env
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        API_URL=$$(cat /workspace/api_url.txt)
        USER_URL=$$(gcloud run services describe ${_SERVICE_USER} \
          --region=${_REGION} --format='value(status.url)')
        ADMIN_URL=$$(gcloud run services describe ${_SERVICE_ADMIN} \
          --region=${_REGION} --format='value(status.url)')
        echo "CLIENT_URL=$$USER_URL"
        echo "ADMIN_URL=$$ADMIN_URL"
        echo "BACKEND_URL=$$API_URL"
        gcloud run services update ${_SERVICE_API} \
          --region=${_REGION} \
          --update-env-vars="CLIENT_URL=$$USER_URL,ADMIN_URL=$$ADMIN_URL,BACKEND_URL=$$API_URL" \
          --quiet
    waitFor:
      - deploy-user
      - deploy-admin
