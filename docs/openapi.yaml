openapi: 3.0.3
info:
  title: Naracol Estudio API
  version: 2.0.0
  description: |
    Catálogo de diseño e impresión 3D. Los pedidos se hacen por WhatsApp,
    así que no hay carrito ni pagos. Todo el contenido se administra
    desde /admin (JWT Bearer).
servers:
  - url: /api/v1

tags:
  - name: Público
  - name: Admin

paths:
  /health:
    get:
      tags: [Público]
      summary: Estado del API y de la base de datos
      responses:
        '200': { description: OK }
        '503': { description: Base de datos no disponible }

  /banners:
    get:
      tags: [Público]
      summary: Banners activos y vigentes del carrusel, en orden
      responses:
        '200':
          description: Lista de banners
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PublicBanner' } }

  /sections:
    get:
      tags: [Público]
      summary: Secciones activas con su paleta de colores disponibles
      responses:
        '200':
          description: Lista de secciones
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/SectionOverview' } }

  /sections/{slug}:
    get:
      tags: [Público]
      summary: Detalle de una sección con sus productos activos
      parameters: [{ $ref: '#/components/parameters/Slug' }]
      responses:
        '200':
          description: Sección
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SectionDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  /products:
    get:
      tags: [Público]
      summary: Productos visibles (máx. 60)
      parameters:
        - in: query
          name: featured
          schema: { type: boolean }
          description: Solo destacados
      responses:
        '200':
          description: Lista de productos
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ProductCard' } }

  /products/{slug}:
    get:
      tags: [Público]
      summary: Detalle de producto con sus colores disponibles
      parameters: [{ $ref: '#/components/parameters/Slug' }]
      responses:
        '200':
          description: Producto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  /settings:
    get:
      tags: [Público]
      summary: Ajustes públicos (WhatsApp, mensaje por defecto, redes)
      responses:
        '200':
          description: Ajustes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settings' }

  /admin/auth/login:
    post:
      tags: [Admin]
      summary: Iniciar sesión (bloqueo de 30 min tras 5 intentos fallidos)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200': { description: 'Token JWT (8 h) y usuario' }
        '401': { description: Credenciales inválidas }
        '423': { description: Cuenta bloqueada temporalmente }

  /admin/summary:
    get:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Conteos para el inicio del admin
      responses:
        '200': { description: 'banners, activeBanners, sections, products, colors, soldOutColors' }

  /admin/banners:
    get:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Todos los banners (incluye inactivos y fuera de fecha)
      responses: { '200': { description: Lista } }
    post:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Crear banner (se agrega al final)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BannerInput' }
      responses:
        '201': { description: Creado }
        '400': { $ref: '#/components/responses/BadRequest' }

  /admin/banners/order:
    patch:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Reordenar banners
      requestBody: { $ref: '#/components/requestBodies/Reorder' }
      responses: { '204': { description: Reordenado } }

  /admin/banners/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Editar banner (parcial)
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BannerInput' }
      responses: { '200': { description: Actualizado }, '404': { $ref: '#/components/responses/NotFound' } }
    delete:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Eliminar banner
      responses: { '204': { description: Eliminado } }

  /admin/colors:
    get:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Biblioteca de colores de filamento, con conteo de uso
      responses: { '200': { description: Lista } }
    post:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Crear color
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ColorInput' }
      responses: { '201': { description: Creado }, '409': { description: Nombre repetido } }

  /admin/colors/order:
    patch:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Reordenar colores
      requestBody: { $ref: '#/components/requestBodies/Reorder' }
      responses: { '204': { description: Reordenado } }

  /admin/colors/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Editar color. available=false lo oculta de todas las paletas.
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ColorInput' }
      responses: { '200': { description: Actualizado } }
    delete:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Eliminar color (se quita de secciones y productos)
      responses: { '204': { description: Eliminado } }

  /admin/sections:
    get:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Todas las secciones con su paleta y número de productos
      responses: { '200': { description: Lista } }
    post:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Crear sección
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SectionInput' }
      responses: { '201': { description: Creada }, '409': { description: Slug repetido } }

  /admin/sections/order:
    patch:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Reordenar secciones
      requestBody: { $ref: '#/components/requestBodies/Reorder' }
      responses: { '204': { description: Reordenado } }

  /admin/sections/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Sección por id
      responses: { '200': { description: Sección } }
    patch:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Editar sección. Si se envía colorIds, reemplaza la paleta en ese orden.
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SectionInput' }
      responses: { '200': { description: Actualizada } }
    delete:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Eliminar sección (sus productos quedan sin sección)
      responses: { '204': { description: Eliminada } }

  /admin/products:
    get:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Todos los productos
      parameters:
        - in: query
          name: sectionId
          schema: { type: string }
      responses: { '200': { description: Lista } }
    post:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Crear producto
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses: { '201': { description: Creado }, '409': { description: Slug repetido } }

  /admin/products/order:
    patch:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Reordenar productos
      requestBody: { $ref: '#/components/requestBodies/Reorder' }
      responses: { '204': { description: Reordenado } }

  /admin/products/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Producto por id
      responses: { '200': { description: Producto } }
    patch:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Editar producto. Si se envía colorIds, reemplaza sus colores en ese orden.
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses: { '200': { description: Actualizado } }
    delete:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Eliminar producto
      responses: { '204': { description: Eliminado } }

  /admin/settings:
    get:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Ajustes
      responses:
        '200':
          description: Ajustes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settings' }
    patch:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Actualizar ajustes (solo claves conocidas)
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Settings' }
      responses: { '200': { description: Ajustes actualizados }, '400': { $ref: '#/components/responses/BadRequest' } }

  /admin/uploads/images:
    post:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Subir imagen a GCS (se convierte a WebP)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, format: binary, description: 'JPG, PNG o WebP, máx. 15 MB' }
                folder: { type: string, enum: [banners, sections, products], default: products }
      responses:
        '201':
          description: URL pública
          content:
            application/json:
              schema: { type: object, properties: { url: { type: string } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { description: GCS no configurado }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }

  parameters:
    Slug: { in: path, name: slug, required: true, schema: { type: string } }
    Id: { in: path, name: id, required: true, schema: { type: string, format: uuid } }

  requestBodies:
    Reorder:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [ids]
            properties:
              ids: { type: array, items: { type: string }, description: 'Ids en el orden deseado' }

  responses:
    NotFound:
      description: No encontrado
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    BadRequest:
      description: Datos inválidos
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  schemas:
    Error:
      type: object
      properties: { error: { type: string } }

    Color:
      type: object
      properties:
        id: { type: string }
        name: { type: string, example: Verde rana }
        hex: { type: string, example: '#3FA34D' }

    PublicBanner:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        subtitle: { type: string, nullable: true }
        imageDesktop: { type: string }
        imageMobile: { type: string, nullable: true }
        ctaLabel: { type: string, nullable: true }
        ctaUrl: { type: string, nullable: true }

    SectionOverview:
      type: object
      properties:
        id: { type: string }
        name: { type: string, example: Temporada }
        slug: { type: string, example: temporada }
        tag: { type: string, nullable: true, example: NAVIDAD }
        description: { type: string }
        coverImage: { type: string, nullable: true }
        colors: { type: array, items: { $ref: '#/components/schemas/Color' } }
        productCount: { type: integer }

    ProductCard:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        image: { type: string, nullable: true }
        images: { type: array, items: { type: string } }
        price: { type: integer, nullable: true, description: 'COP; null = a cotizar' }
        featured: { type: boolean }
        colors: { type: array, items: { $ref: '#/components/schemas/Color' } }

    SectionDetail:
      allOf:
        - $ref: '#/components/schemas/SectionOverview'
        - type: object
          properties:
            products: { type: array, items: { $ref: '#/components/schemas/ProductCard' } }

    ProductDetail:
      allOf:
        - $ref: '#/components/schemas/ProductCard'
        - type: object
          properties:
            description: { type: string }
            section:
              type: object
              nullable: true
              properties: { name: { type: string }, slug: { type: string }, tag: { type: string, nullable: true } }

    Settings:
      type: object
      properties:
        whatsappNumber: { type: string, example: '573054050812' }
        whatsappMessage: { type: string }
        instagramUrl: { type: string }
        tiktokUrl: { type: string }
        facebookUrl: { type: string }
        contactEmail: { type: string }

    BannerInput:
      type: object
      required: [title, imageDesktop]
      properties:
        title: { type: string, maxLength: 120 }
        subtitle: { type: string, nullable: true, maxLength: 240 }
        imageDesktop: { type: string }
        imageMobile: { type: string, nullable: true }
        ctaLabel: { type: string, nullable: true, maxLength: 40 }
        ctaUrl: { type: string, nullable: true, description: 'Empieza por / o https://' }
        active: { type: boolean }
        startsAt: { type: string, format: date-time, nullable: true }
        endsAt: { type: string, format: date-time, nullable: true }

    ColorInput:
      type: object
      required: [name, hex]
      properties:
        name: { type: string, maxLength: 60 }
        hex: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
        available: { type: boolean }

    SectionInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 60 }
        slug: { type: string, description: 'Si se omite al crear, se genera del nombre' }
        tag: { type: string, nullable: true, maxLength: 30 }
        description: { type: string, maxLength: 600 }
        coverImage: { type: string, nullable: true }
        active: { type: boolean }
        colorIds: { type: array, items: { type: string }, description: 'Paleta, en orden' }

    ProductInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 120 }
        slug: { type: string }
        description: { type: string, maxLength: 4000 }
        sectionId: { type: string, nullable: true }
        images: { type: array, items: { type: string } }
        price: { type: integer, nullable: true, minimum: 0 }
        featured: { type: boolean }
        active: { type: boolean }
        colorIds: { type: array, items: { type: string } }
